name: Update profile art

"on":
  schedule:
    - cron: "30 6 * * *"   # 12:00 PM IST (06:30 UTC) daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decide how many commits today
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/decide_commits.py >> "$GITHUB_OUTPUT"
          else
            echo "commits=1" >> "$GITHUB_OUTPUT"
          fi

      - if: fromJSON(steps.plan.outputs.commits) >= 1
        run: pip install requests beautifulsoup4
      - if: fromJSON(steps.plan.outputs.commits) >= 1
        run: python scripts/fetch_contributions.py
      - if: fromJSON(steps.plan.outputs.commits) >= 1
        run: python scripts/render_heatmap_svg.py
      - if: fromJSON(steps.plan.outputs.commits) >= 1
        run: python scripts/make_stats_cards.py
      - name: Generate 3D Profile Contrib (GitBlock)
        if: fromJSON(steps.plan.outputs.commits) >= 1
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Devesh0777

      - name: Generate github-snake.svg
        if: fromJSON(steps.plan.outputs.commits) >= 1
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Devesh0777
          outputs: |
            github-snake.svg?color_snake=#A78BFA&color_dots=#2d3343,#10B981,#0891B2,#22D3EE,#A78BFA

      - name: Stamp refresh log
        if: fromJSON(steps.plan.outputs.commits) >= 1
        run: printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/last_update.txt

      - name: Commit 1 - heatmap and stats
        uses: stefanzweifel/git-auto-commit-action@v5
        if: fromJSON(steps.plan.outputs.commits) >= 1
        with:
          commit_message: "chore: refresh contribution heatmap and stats [skip ci]"
          file_pattern: "data/last_update.txt data/contributions.json contrib-heatmap.svg github-stats.svg top-langs.svg"

      - name: Stamp commit plan
        if: fromJSON(steps.plan.outputs.commits) >= 2
        run: printf '{"date":"%s","commits":%s}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ steps.plan.outputs.commits }}" > data/commit_plan.json

      - name: Commit 2 - snake and 3D profile art
        uses: stefanzweifel/git-auto-commit-action@v5
        if: fromJSON(steps.plan.outputs.commits) >= 2
        with:
          commit_message: "chore: regenerate snake and 3D profile art [skip ci]"
          file_pattern: "data/commit_plan.json github-snake.svg profile-3d-contrib/* profile-gitblock.svg"