name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - name: Generate github-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pruthvi828
          outputs: |
            github-snake.svg?color_snake=#A78BFA&color_dots=#2d3343,#10B981,#0891B2,#22D3EE,#A78BFA
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and snake [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg github-snake.svg"
