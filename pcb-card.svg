<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 225" width="490" height="225">
<style>
    .silkscreen {
        font-family: 'Courier New', Courier, monospace;
        fill: #ccffcc;
    }
    .title {
        font-size: 12px;
        font-weight: bold;
    }
    .subtitle {
        font-size: 9px;
    }
    
    .trace-base {
        fill: none;
        stroke: #006600;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.4;
    }
    
    .trace-flow {
        fill: none;
        stroke: #39d353;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 20 1000;
        stroke-dashoffset: 1000;
        animation: flow 3s linear infinite;
    }
    
    @keyframes flow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: -200; }
    }
</style>
<rect width="100%" height="100%" fill="#003300" rx="8" />

