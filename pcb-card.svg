<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240">
<defs>
    <filter id="pcb-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur" />
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>

<style>
    .silkscreen {
        font-family: 'Courier New', Courier, monospace;
        fill: #A77BFF;
        filter: url(#pcb-glow);
    }
    .title {
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    .subtitle {
        font-size: 11px;
        fill: #86EFAC;
    }
    
    .trace-base {
        fill: none;
        stroke: #1B0E33;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.6;
    }
    
    .trace-flow {
        fill: none;
        stroke: #D4BEFF;
        stroke-width: 3;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 25 1000;
        stroke-dashoffset: 1000;
        animation: flow 3s linear infinite;
        filter: url(#pcb-glow);
    }
    
    @keyframes flow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: -200; }
    }
</style>
<rect width="100%" height="100%" fill="#0B0813" stroke="#A77BFF" stroke-width="2" rx="10" />

<!-- Corner Accents -->
<g stroke="#A77BFF" stroke-width="1.5" opacity="0.8">
    <line x1="12" y1="12" x2="24" y2="12" /><line x1="12" y1="12" x2="12" y2="24" />
    <line x1="848" y1="12" x2="836" y2="12" /><line x1="848" y1="12" x2="848" y2="24" />
    <line x1="12" y1="228" x2="24" y2="228" /><line x1="12" y1="228" x2="12" y2="216" />
    <line x1="848" y1="228" x2="836" y2="228" /><line x1="848" y1="228" x2="848" y2="216" />
</g>

