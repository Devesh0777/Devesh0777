<!-- Trace flows -->
<path class="trace-flow" d="M 40,120 L 100,120 L 120,90 L 160,90" style="animation-delay: 0.0s;" />
<path class="trace-flow" d="M 360,90 L 420,90 L 450,50 L 520,50" style="animation-delay: 1.0s;" />
<path class="trace-flow" d="M 360,140 L 420,140 L 450,180 L 520,180" style="animation-delay: 1.2s;" />
<path class="trace-flow" d="M 700,180 L 760,180 L 790,210 L 820,210" style="animation-delay: 2.2s;" />
<path class="trace-flow" d="M 700,50 L 770,50 L 790,30 L 820,30" style="animation-delay: 2.0s;" />
<path class="trace-flow" d="M 40,40 L 80,40 L 100,20 L 200,20" style="animation-delay: 0.5s;" />
