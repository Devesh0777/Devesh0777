<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240">
    <defs>
        <filter id="hacker-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00FF66" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#00FF66" stop-opacity="0.0"/>
        </linearGradient>
    </defs>

    <style>
        .bg { fill: #050C07; stroke: #00FF66; stroke-width: 2; }
        .header-title { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #00FF66; letter-spacing: 2px; filter: url(#hacker-glow); }
        .axis-text { font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #86EFAC; }
        .graph-line { fill: none; stroke: #00FF66; stroke-width: 2.5; filter: url(#hacker-glow); }
        .graph-point { fill: #050C07; stroke: #00FF66; stroke-width: 2; filter: url(#hacker-glow); transition: transform 0.2s; }
        .grid-line { stroke: #0F2E17; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>

    <!-- Outer Frame -->
    <rect width="860" height="240" class="bg" rx="10" />

    <!-- Corner Accents -->
    <g stroke="#00FF66" stroke-width="1.5" opacity="0.8">
        <line x1="12" y1="12" x2="24" y2="12" /><line x1="12" y1="12" x2="12" y2="24" />
        <line x1="848" y1="12" x2="836" y2="12" /><line x1="848" y1="12" x2="848" y2="24" />
        <line x1="12" y1="228" x2="24" y2="228" /><line x1="12" y1="228" x2="12" y2="216" />
        <line x1="848" y1="228" x2="836" y2="228" /><line x1="848" y1="228" x2="848" y2="216" />
    </g>

    <!-- Header Bar -->
    <text x="25" y="32" class="header-title">[SYSTEM.ANALYTICS // ANNUAL COMMIT &amp; CODE ACTIVITY GRAPH]</text>
    <line x1="25" y1="42" x2="835" y2="42" stroke="#00FF66" stroke-width="1" opacity="0.4" />

    <!-- Grid Horizontal Lines -->
    <line x1="70" y1="60" x2="810" y2="60" class="grid-line" />
    <line x1="70" y1="125.0" x2="810" y2="125.0" class="grid-line" />
    <line x1="70" y1="190" x2="810" y2="190" stroke="#00FF66" stroke-width="1.5" opacity="0.6" />

    <!-- Y Axis Labels -->
    <text x="55" y="64" class="axis-text" text-anchor="end">250</text>
    <text x="55" y="129.0" class="axis-text" text-anchor="end">125</text>
    <text x="55" y="194" class="axis-text" text-anchor="end">0</text>

    <!-- Area Fill & Main Line -->
    <path d="M 70.0,169.0 L 137.3,156.0 L 204.5,147.5 L 271.8,163.0 L 339.1,135.0 L 406.4,142.5 L 473.6,125.0 L 540.9,110.0 L 608.2,117.5 L 675.5,100.0 L 742.7,85.0 L 810.0,70.0 L 810,190 L 70,190 Z" fill="url(#area-grad)" />
    <path d="M 70.0,169.0 L 137.3,156.0 L 204.5,147.5 L 271.8,163.0 L 339.1,135.0 L 406.4,142.5 L 473.6,125.0 L 540.9,110.0 L 608.2,117.5 L 675.5,100.0 L 742.7,85.0 L 810.0,70.0" class="graph-line" />

    <!-- Data Points & X Axis Labels -->
    <text x="70.0" y="210" class="axis-text" text-anchor="middle">JAN</text>
    <circle cx="70.0" cy="169.0" r="4" class="graph-point" />
    <text x="137.3" y="210" class="axis-text" text-anchor="middle">FEB</text>
    <circle cx="137.3" cy="156.0" r="4" class="graph-point" />
    <text x="204.5" y="210" class="axis-text" text-anchor="middle">MAR</text>
    <circle cx="204.5" cy="147.5" r="4" class="graph-point" />
    <text x="271.8" y="210" class="axis-text" text-anchor="middle">APR</text>
    <circle cx="271.8" cy="163.0" r="4" class="graph-point" />
    <text x="339.1" y="210" class="axis-text" text-anchor="middle">MAY</text>
    <circle cx="339.1" cy="135.0" r="4" class="graph-point" />
    <text x="406.4" y="210" class="axis-text" text-anchor="middle">JUN</text>
    <circle cx="406.4" cy="142.5" r="4" class="graph-point" />
    <text x="473.6" y="210" class="axis-text" text-anchor="middle">JUL</text>
    <circle cx="473.6" cy="125.0" r="4" class="graph-point" />
    <text x="540.9" y="210" class="axis-text" text-anchor="middle">AUG</text>
    <circle cx="540.9" cy="110.0" r="4" class="graph-point" />
    <text x="608.2" y="210" class="axis-text" text-anchor="middle">SEP</text>
    <circle cx="608.2" cy="117.5" r="4" class="graph-point" />
    <text x="675.5" y="210" class="axis-text" text-anchor="middle">OCT</text>
    <circle cx="675.5" cy="100.0" r="4" class="graph-point" />
    <text x="742.7" y="210" class="axis-text" text-anchor="middle">NOV</text>
    <circle cx="742.7" cy="85.0" r="4" class="graph-point" />
    <text x="810.0" y="210" class="axis-text" text-anchor="middle">DEC</text>
    <circle cx="810.0" cy="70.0" r="4" class="graph-point" />
</svg>